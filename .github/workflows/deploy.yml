name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The build fails, and nothing is deployed, if the types break, the clearance rules regress,
      # a pending entry is committed or dist/ holds a trace of one.
      - uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@11.1.3
          build-cmd: pnpm check && pnpm test && pnpm test:clearance

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
